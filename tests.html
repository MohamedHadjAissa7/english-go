<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الاختبارات — English GO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #FFD700;
    --yellow-dark: #E6C200;
    --black: #0A0A0A;
    --white: #FFFFFF;
    --gray: #F5F5F0;
    --gray-mid: #E8E8E0;
    --text-muted: #6B6B60;
    --nav-h: 70px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Cairo', sans-serif; background: var(--gray); color: var(--black); padding-top: calc(var(--nav-h) + 2rem); }
 
  /* شريط التنقل */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: var(--nav-h); background: var(--black);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 2rem; border-bottom: 3px solid var(--yellow);
  }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--yellow); letter-spacing: 3px; text-decoration: none; }
  .logo span { color: var(--white); }
  .nav-links { display: flex; gap: 0.5rem; list-style: none; }
  .nav-links a { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 0.85rem; font-weight: 600; padding: 8px 14px; border-radius: 6px; transition: all 0.2s; }
  .nav-links a:hover, .nav-links a.active { background: var(--yellow); color: var(--black); }
 
  main { max-width: 800px; margin: 0 auto; padding: 2rem; }
  .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 3rem; color: var(--black); letter-spacing: 1px; margin-bottom: 2rem; text-align: center; }
 
  /* بطاقة الاختبار */
  .test-card { background: var(--white); border-radius: 20px; padding: 2.5rem; border: 1px solid var(--gray-mid); border-top: 5px solid var(--black); box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
  .test-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--gray-mid); }
  .timer { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; color: #ff4757; background: #ffebeb; padding: 4px 12px; border-radius: 8px; }
  
  .question-text { font-size: 1.25rem; font-weight: 700; margin-bottom: 1.5rem; }
  
  .options-list { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 2rem; }
  .option-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem; background: var(--gray); border: 1px solid var(--gray-mid);
    border-radius: 10px; cursor: pointer; transition: all 0.2s; font-size: 1rem;
  }
  .option-item:hover { background: var(--yellow-dark); color: var(--black); border-color: var(--yellow-dark); }
  .option-item.selected { background: var(--yellow); color: var(--black); border-color: var(--yellow-dark); font-weight: bold; }

  .actions-row { display: flex; justify-content: flex-end; }
  .btn-next { background: var(--black); color: var(--yellow); border: none; font-family: 'Cairo', sans-serif; font-size: 1rem; font-weight: 700; padding: 12px 30px; border-radius: 10px; cursor: pointer; transition: 0.2s; }
  .btn-next:hover { background: var(--yellow); color: var(--black); }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">English <span>GO</span></a>
  <ul class="nav-links">
    <li><a href="index.html">الرئيسية</a></li>
    <li><a href="diagnostic.html">تحديد المستوى</a></li>
    <li><a href="lessons.html">الدروس</a></li>
    <li><a href="exercises.html">التمارين</a></li>
    <li><a href="tests.html" class="active">الاختبارات</a></li>
    <li><a href="profile.html">تقدمي</a></li>
  </ul>
</nav>
 
<main>
  <h1 class="page-title">UNIT 1 TEST — اختبار الوحدة الأولى</h1>
  
  <div class="test-card">
    <div class="test-header">
      <span id="progressText" style="font-weight: 600; color: var(--text-muted);">السؤال 1 من 3</span>
      <span class="timer" id="timerDisplay">02:00</span>
    </div>
    
    <div class="question-text" id="questionText">جاري تحميل السؤال...</div>
    
    <div class="options-list" id="optionsList"></div>
    
    <div class="actions-row">
      <button class="btn-next" id="nextBtn" onclick="nextQuestion()">التالي ←</button>
    </div>
  </div>
</main>

<script>
const testQuestions = [
  { q: "Choose the correct verb: He ________ TV in the evening.", options: ["watch", "watches", "watching", "watched"], answer: "watches" },
  { q: "Identify the pronoun: My friend and I went shopping. ________ bought some clothes.", options: ["We", "They", "He", "Us"], answer: "We" },
  { q: "Complete the sentence: They ________ not speak French fluently.", options: ["does", "do", "doing", "are"], answer: "do" }
];

let currentQ = 0;
let score = 0;
let timeLeft = 120; // دقيقتان
let timerInterval;
let selectedAnswer = null;

function startTimer() {
  timerInterval = setInterval(() => {
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      finishTest(true);
    } else {
      timeLeft--;
      let mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      let secs = (timeLeft % 60).toString().padStart(2, '0');
      document.getElementById('timerDisplay').textContent = `${mins}:${secs}`;
    }
  }, 1000);
}

function loadQuestion() {
  selectedAnswer = null;
  const qObj = testQuestions[currentQ];
  document.getElementById('progressText').textContent = `السؤال ${currentQ + 1} من ${testQuestions.length}`;
  document.getElementById('questionText').textContent = qObj.q;
  
  const list = document.getElementById('optionsList');
  list.innerHTML = '';
  
  qObj.options.forEach(opt => {
    const div = document.createElement('div');
    div.className = 'option-item';
    div.textContent = opt;
    div.onclick = () => selectOption(div, opt);
    list.appendChild(div);
  });

  if(currentQ === testQuestions.length - 1) {
    document.getElementById('nextBtn').textContent = "إنهاء الاختبار";
  }
}

function selectOption(element, val) {
  const items = document.querySelectorAll('.option-item');
  items.forEach(i => i.classList.remove('selected'));
  element.classList.add('selected');
  selectedAnswer = val;
}

function nextQuestion() {
  if (!selectedAnswer) {
    alert("الرجاء اختيار إجابة أولاً!");
    return;
  }

  if (selectedAnswer === testQuestions[currentQ].answer) {
    score++;
  }

  currentQ++;
  if (currentQ < testQuestions.length) {
    loadQuestion();
  } else {
    clearInterval(timerInterval);
    finishTest(false);
  }
}

function finishTest(timeout) {
  const finalScorePct = Math.round((score / testQuestions.length) * 100);
  
  // تحديث الـ localStorage ليعكس عدد الاختبارات المكتملة في صفحة "تقدمي"
  let testsDoneCount = parseInt(localStorage.getItem('eg_tests_done') || '0');
  localStorage.setItem('eg_tests_done', (testsDoneCount + 1).toString());

  if (timeout) {
    alert(`انتهى الوقت الحركي! نتيجتك هي: ${finalScorePct}%`);
  } else {
    alert(`أحسنت! أكملت الاختبار بنجاح. نتيجتك هي: ${finalScorePct}%`);
  }
  
  window.location.href = "profile.html";
}

window.onload = () => {
  startTimer();
  loadQuestion();
};
</script>
</body>
</html>
